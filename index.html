<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYPTIX X-MD | Whitekid Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00e5ff; --pink: #ff2bd6; --bg: #06081a; --glass: rgba(255,255,255,0.04); --text: #eaf6ff; --muted: #8b97c4; --border: rgba(0,229,255,0.18); }
        body { min-height: 100vh; color: var(--text); font-family: 'Poppins', sans-serif;
               background: radial-gradient(900px 500px at 90% -10%, rgba(0,229,255,0.18), transparent 60%),
                           radial-gradient(800px 500px at -10% 110%, rgba(255,43,214,0.18), transparent 60%), var(--bg); }
        .navbar { background: rgba(6,8,26,0.7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 0; }
        .navbar-brand { font-weight: 800; letter-spacing: 2px; font-size: 1.35rem; background: linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
        .brand-sub { color: var(--muted); font-size: 11px; letter-spacing: 3px; }
        .stats-card { background: var(--glass); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 22px; text-align: center; box-shadow: 0 0 40px rgba(0,229,255,0.08) inset; }
        .stats-card h3 { font-size: 3rem; font-weight: 800; margin: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stats-card p { color: var(--muted); letter-spacing: 3px; font-size: 12px; }
        .post-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 22px; transition: .25s; }
        .post-card:hover { border-color: var(--cyan); box-shadow: 0 0 25px rgba(0,229,255,0.15); }
        .post-card h5 { font-weight: 700; letter-spacing: 1px; }
        .form-control { background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: var(--text); border-radius: 12px; }
        .form-control:focus { background: rgba(0,0,0,0.5); color: var(--text); border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,229,255,0.15); }
        .form-label { color: var(--muted); font-size: 13px; }
        .btn-primary { background: linear-gradient(90deg, var(--cyan), var(--pink)); border: none; color: #06081a; font-weight: 700; border-radius: 12px; padding: 10px 22px; }
        .btn-primary:hover { filter: brightness(1.1); color: #06081a; }
        .btn-danger { background: transparent; border: 1px solid #ff4d6d; color: #ff4d6d; border-radius: 12px; }
        .btn-danger:hover { background: #ff4d6d; color: #fff; }
        .console-body { background: #02030c; border: 1px solid var(--border); border-radius: 12px; height: 250px; overflow-y: auto; padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--cyan); }
        .hidden { display: none !important; }
        .status-badge { padding: 5px 15px; border-radius: 20px; font-weight: 700; font-size: 12px; letter-spacing: 1px; color: #06081a; }
        .connected { background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
        .disconnected { background: #ff4d6d; }
        .progress-container { width: 100%; background-color: rgba(255,255,255,0.08); border-radius: 10px; margin-top: 15px; display: none; }
        .progress-bar { width: 0%; height: 8px; background: linear-gradient(90deg, var(--cyan), var(--pink)); border-radius: 10px; transition: width .5s ease; }
        .loading-text { font-size: 12px; color: var(--muted); margin-top: 5px; text-align: center; }
        .footer { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 2px; padding: 18px 0 30px; }
        #pairingResult { color: var(--cyan) !important; letter-spacing: 4px; text-shadow: 0 0 14px rgba(0,229,255,0.6); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#"><i class="fas fa-bolt me-2"></i>KRYPTIX X-MD</a>
            <span class="brand-sub d-none d-sm-inline">BY WHITEKID TECH</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="stats-card">
            <h3 id="totalActive">0</h3>
            <p class="mb-0">BOTS ONLINE</p>
        </div>

        <div id="setupSection">
            <div class="post-card">
                <h5 class="mb-3"><i class="fas fa-satellite-dish me-2"></i>DEPLOY A BOT</h5>
                <div class="input-group mb-1">
                    <input type="text" id="userIdInput" class="form-control" placeholder="Choose a unique bot ID (e.g., kryptix1)">
                    <button class="btn btn-primary" onclick="selectUser()">CONTINUE</button>
                </div>
            </div>
        </div>

        <div id="userDashboard" class="hidden">
            <div id="stage1">
                <div class="post-card">
                    <h5><i class="fas fa-link me-2"></i>LINK YOUR WHATSAPP</h5>
                    <div class="mb-3">
                        <label class="form-label">WhatsApp number (with country code)</label>
                        <input type="tel" class="form-control" id="pairNumber" placeholder="263789846423">
                    </div>
                    <button class="btn btn-primary w-100" id="pairBtn">GET PAIRING CODE</button>

                    <div id="progressContainer" class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                        <div class="loading-text">⏳ Connecting to WhatsApp... please wait.</div>
                    </div>

                    <div id="pairingResult" class="mt-3 text-center h4"></div>
                </div>
            </div>

            <div id="stage2" class="hidden">
                <div class="post-card d-flex justify-content-between align-items-center">
                    <div>
                        <span id="connectionStatus" class="status-badge disconnected">OFFLINE</span>
                        <span class="ms-2" id="activeBotName"></span>
                    </div>
                    <button class="btn btn-danger btn-sm" id="logoutBtn">LOGOUT</button>
                </div>
                <div class="post-card">
                    <h5><i class="fas fa-terminal me-2"></i>LIVE CONSOLE</h5>
                    <div class="console-body" id="console"></div>
                </div>
            </div>
        </div>
        <div class="footer">KRYPTIX X-MD &bull; WHITEKID TECH</div>
    </div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentUserId = null;

        function selectUser() {
            const userId = document.getElementById('userIdInput').value.trim();
            if (!userId) return alert('Enter a bot name');
            currentUserId = userId;
            socket.emit('set-user', userId);
            document.getElementById('activeBotName').innerText = "Bot: " + userId;
            document.getElementById('userDashboard').classList.remove('hidden');
            document.getElementById('stage1').classList.remove('hidden');
            document.getElementById('stage2').classList.add('hidden');
        }

        socket.on('total-active', (count) => {
            document.getElementById('totalActive').innerText = count;
        });

        socket.on('pairing-code', (code) => {
            // Hide loading bar and show code
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('pairingResult').innerText = "CODE: " + code;
        });

        socket.on('console', (log) => {
            const consoleDiv = document.getElementById('console');
            const entry = document.createElement('div');
            entry.innerHTML = `[${log.timestamp}] ${log.message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        });

        socket.on('connection-status', (status) => {
            const badge = document.getElementById('connectionStatus');
            if (status.connected) {
                badge.className = 'status-badge connected';
                badge.innerText = 'ONLINE';
                document.getElementById('stage1').classList.add('hidden');
                document.getElementById('stage2').classList.remove('hidden');
                document.getElementById('progressContainer').style.display = 'none';
            } else {
                badge.className = 'status-badge disconnected';
                badge.innerText = 'OFFLINE';
            }
        });

        let isPairing = false;
        document.getElementById('pairBtn').onclick = () => {
            if (isPairing) return;
            const number = document.getElementById('pairNumber').value;
            if (!number) return alert('Enter number');
            
            isPairing = true;
            document.getElementById('pairBtn').disabled = true;
            
            // Show and animate loading bar
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const pairingResult = document.getElementById('pairingResult');
            
            pairingResult.innerText = "";
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            
            // Simulate progress while waiting for socket response
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 90) {
                    clearInterval(interval);
                } else {
                    width += 2;
                    progressBar.style.width = width + '%';
                }
            }, 100);

            socket.emit('pair-request', { userId: currentUserId, number });
            
            // Re-enable after 10 seconds or when code received
            setTimeout(() => {
                isPairing = false;
                document.getElementById('pairBtn').disabled = false;
            }, 10000);
        };

        document.getElementById('logoutBtn').onclick = () => {
            socket.emit('logout', currentUserId);
        };
    </script>
</body>
</html>
